site_name: quant-engine
site_description: C++ quant backtest + research engine and terminal-style dashboard
site_url: "https://qe.jiucheng-zang.ca/"
repo_url: ""
docs_dir: docs
site_dir: site

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.instant
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: black
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  - Safety & known limitations: safety-and-limitations.md
  - Getting started:
      - Download for macOS: download.md
      - Install & setup: install.md
      - First factor (10 min): first-factor-tutorial.md
      - Dashboard walkthrough: dashboard-walkthrough.md
  - Research & backtesting:
      - Factor research: factor-research.md
      - Walk-forward validation: walk-forward.md
      - Multi-strategy portfolios: multi-strategy.md
      - Forecasting: forecasting.md
      - Options pricing: options-model.md
  - Live trading:
      - Safety model: live-trading-safety.md
      - Daemon runbook: live-trading-runbook.md
      - Configuration & accounting: daemon-configuration.md
      - Eval self-healing: eval-self-heal.md
      - Staged entry / exit: staged-entry.md
      - Daemon smoke checklist: qe-daemon-smoke.md
  - Brokers & credentials:
      - IBKR connectivity: ibkr-connectivity.md
      - Paper-trading verification: ibkr-paper-verification.md
      - Broker credentials: broker-credentials.md
      - Credentials security: credentials-security.md
  - Reference:
      - .qe language: qe-language.md
      - Signal DSL grammar: dsl-grammar.md
      - results.json schema: results-json.md
      - Python: python.md
      - TWS wire protocol: ibkr-tws-protocol.md
  - Project & maintenance:
      - Architecture: architecture.md
      - Architecture slides (English): architecture-deck.md
      - 架构幻灯片（中文）: architecture-deck.zh.md
      - Code signing (macOS): code-signing.md
      - Migration & incident history: release-history.md
